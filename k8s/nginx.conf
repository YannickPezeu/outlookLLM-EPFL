server {
    listen 80;
    server_name _;

    # Content-hashed bundles (taskpane.<hash>.bundle.js, see webpack.config.js)
    # are immutable: a new deploy produces a new filename, so we can cache them
    # forever. This is what defeats the Outlook Mac webview's heuristic caching —
    # no old file exists under the new URL, so it cannot serve stale code.
    location ~ ^/outlook/(?<bundle_asset>.+\.[0-9a-f]+\.bundle\.js)$ {
        alias /usr/share/nginx/html/$bundle_asset;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else (taskpane.html, manifest.xml, assets) stays no-cache so the
    # entry HTML is revalidated every load and always references the latest hashed
    # bundle. "no-cache" still allows caching but forces an ETag revalidation
    # (304 when unchanged) on every load.
    location /outlook/ {
        alias /usr/share/nginx/html/;
        index taskpane.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Redirect /outlook to /outlook/
    location = /outlook {
        return 301 /outlook/;
    }

    # pdf.js v5 ships an ESM worker (.mjs). nginx's bundled mime.types maps .js
    # but NOT .mjs, so the worker is served as application/octet-stream and the
    # browser refuses to load it as a module worker (strict MIME check) — which
    # silently breaks PDF attachment extraction in prod (works in dev because
    # webpack-dev-server serves .mjs as text/javascript). Force a JS MIME type.
    location ~ ^/outlook/(?<mjs_asset>.+\.mjs)$ {
        alias /usr/share/nginx/html/$mjs_asset;
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
    }

    # CORS proxy for RCP API
    location /outlook/api/rcp/ {
        # Remove /api/rcp/ prefix and forward to RCP
        rewrite ^/outlook/api/rcp/(.*) /v1/$1 break;
        proxy_pass https://inference.rcp.epfl.ch;
        proxy_ssl_server_name on;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        add_header 'Access-Control-Max-Age' '86400' always;

        # Handle preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
            add_header 'Access-Control-Max-Age' '86400';
            add_header 'Content-Length' '0';
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        # Pass through request headers
        proxy_set_header Host inference.rcp.epfl.ch;
        proxy_set_header X-Real-IP $remote_addr;

        # Streaming support (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
